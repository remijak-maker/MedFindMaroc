org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# AdMob
# ---------------------------------------------------------------------------
# Ne JAMAIS mettre de vrais identifiants AdMob dans ce fichier versionné.
# Pour la production, définissez ces propriétés dans ~/.gradle/gradle.properties
# (fichier personnel, hors du dépôt) :
#
#   medfind.admob.appId=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
#   medfind.admob.bannerId=ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ
#
# Sans ces propriétés, les identifiants de TEST Google sont utilisés.
# Les builds Debug utilisent TOUJOURS les identifiants de test.
#
# Activer / désactiver toutes les publicités :
medfind.ads.enabled=true
